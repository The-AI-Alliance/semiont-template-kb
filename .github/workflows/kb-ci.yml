# Shared CI for every semiont KB repo.
#
# This is a REUSABLE workflow: KB repos don't copy it, they call it —
#
#   jobs:
#     ci:
#       uses: The-AI-Alliance/semiont-template-kb/.github/workflows/kb-ci.yml@main
#
# so the logic lives here alone and a change to it needs no fleet sync. Each
# job self-detects what the calling repo contains and passes cleanly when
# there is nothing of that kind to check — the template has no TypeScript, the
# forks do, and both call this same file.
#
# NOTE: a called job reports its check as "<caller-job-id> / <job-name>", so
# the contexts a ruleset must require are e.g. "ci / shellcheck", NOT
# "shellcheck". Confirm against a real run before editing any ruleset.
name: kb-ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@2.0.0

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if [ -f tsconfig.json ] && [ -f package-lock.json ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "No tsconfig.json + package-lock.json — nothing to typecheck."
          fi
      - if: steps.detect.outputs.run == 'yes'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # `npm ci` installs the LOCKED dependency set — the same one the skills
      # resolve at runtime. Typechecking against `@latest` instead would report
      # drift the repo has not actually adopted yet.
      - if: steps.detect.outputs.run == 'yes'
        run: npm ci --no-audit --no-fund
      - if: steps.detect.outputs.run == 'yes'
        run: npx tsc --noEmit

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      # gitleaks has no result cache: every run rescans whatever range it is
      # given, so the range is the only lever. Full history on a push to main,
      # the PR's own commits on a pull request — two different questions:
      #
      #   push: was a secret EVER committed here (including one since removed)?
      #   PR:   does THIS change add one?
      #
      # Scoping matters because a KB's history is mostly corpus, not code —
      # eu-ode is 112 MB of public consultation documents against ~220 KB for
      # a code-only repo, and rescanning all of it per PR iteration is waste.
      - uses: actions/checkout@v7
        with:
          # PRs need enough depth for the origin/main merge-base to exist;
          # 0 (full) on push, bounded on PR.
          fetch-depth: ${{ github.event_name == 'pull_request' && 50 || 0 }}
      - name: Secret scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
            RANGE="origin/${{ github.base_ref }}..HEAD"
            echo "Scanning PR commits: $RANGE"
            docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
              detect --source=/repo --redact --no-banner --log-opts="$RANGE"
          else
            echo "Scanning full history"
            docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
              detect --source=/repo --redact --no-banner
          fi
      - id: detect
        run: |
          if [ -f package-lock.json ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "No package-lock.json — no dependency tree to audit."
          fi
      - if: steps.detect.outputs.run == 'yes'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - if: steps.detect.outputs.run == 'yes'
        run: npm audit --audit-level=high
